<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Invitados</title>

    <!-- QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        .tab.active {
            background: #007bff;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .1);
        }

        input,
        select,
        button {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        .ok {
            color: green;
            font-weight: bold;
        }

        .no {
            color: red;
            font-weight: bold;
        }

        .pendiente {
            color: orange;
            font-weight: bold;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .disponibles-ok {
            color: green;
            font-weight: bold;
        }

        .disponibles-cero {
            color: red;
            font-weight: bold;
        }

        .estado-ok {
            color: green;
            font-weight: bold;
        }

        .estado-denegado {
            color: red;
            font-weight: bold;
        }

        .estado-pendiente {
            color: orange;
            font-weight: bold;
        }

        .resumen {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎟 Control de Invitados</h1>

    <div class="tabs">
        <button class="tab active" onclick="mostrar('qr', this)">QR</button>
        <button class="tab" onclick="mostrar('buscar', this)">Buscar</button>
        <button class="tab" onclick="mostrar('lista', this)">Lista</button>
    </div>

    <!-- QR -->
    <div id="qr" class="section active">
        <div id="reader"></div>
    </div>

    <!-- BUSCAR -->
    <div id="buscar" class="section">
        <div class="card">
            <h3>Buscar Invitado</h3>

            <input type="text" id="familiaManual" placeholder="Nombre o familia">

            <button onclick="buscar()">
                Buscar
            </button>
        </div>
    </div>

    <!-- RESULTADOS -->
    <div id="resultados" class="section">
        <div id="listaResultados"></div>
    </div>

    <!-- INFO -->
    <div id="infoBox" class="section">

        <div class="card">

            <h2 id="nombre"></h2>

            <p>
                🎟 Pases:
                <span id="pases"></span>
            </p>

            <p>
                ✅ Usados:
                <span id="usados"></span>
            </p>

            <p>
                🎫 Disponibles:
                <span id="disponibles"></span>
            </p>

            <p id="estadoAcceso"></p>

            <input type="number"
                id="pasesUsar"
                min="1"
                value="1">

            <button class="btn-primary"
                onclick="registrar()">
                Registrar Entrada
            </button>

            <div id="mensaje"
                style="display:none;color:green;margin-top:10px;">
                Entrada registrada correctamente
            </div>

        </div>

    </div>

    <!-- LISTA -->
    <div id="lista" class="section">

        <div class="resumen" id="resumen"></div>

        <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">

            <input type="text"
                id="busqueda"
                placeholder="Buscar">

            <select id="filtroEstado">
                <option value="todos">Todos</option>
                <option value="aceptados">Aceptados</option>
                <option value="rechazados">Rechazados</option>
                <option value="pendientes">Pendientes</option>
            </select>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Familia</th>
                    <th>Nombre</th>
                    <th>Pases</th>
                    <th>Usados</th>
                    <th>Disponibles</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody id="tabla"></tbody>

        </table>

    </div>

<script>

let invitados = [];
let invitadoActual = null;
let qrScanner = null;

/* =========================
   NAVEGACIÓN
========================= */

function mostrar(id, btn = null){

    document
    .querySelectorAll(".section")
    .forEach(s => s.classList.remove("active"));

    document
    .querySelectorAll(".tab")
    .forEach(b => b.classList.remove("active"));

    document
    .getElementById(id)
    .classList.add("active");

    if(btn)
        btn.classList.add("active");

    if(id === "qr"){
        iniciarQR();
    }

    if(id === "lista"){
        cargarLista();
    }
}

/* =========================
   QR
========================= */

function iniciarQR(){

    if(qrScanner)
        return;

    qrScanner = new Html5Qrcode("reader");

    qrScanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        (txt) => {

            try{

                const data = JSON.parse(txt);

                if(!data.familia){
                    alert("QR inválido");
                    return;
                }

                buscarPorFamilia(data.familia);

                qrScanner.stop();
                qrScanner = null;

            }catch(err){

                alert("QR inválido");

            }

        }
    );
}

/* =========================
   BUSCAR
========================= */

function buscar(){

    const valor =
        document
        .getElementById("familiaManual")
        .value
        .trim();

    if(!valor)
        return;

    buscarInvitado(valor);
}

function buscarInvitado(nombre){

    fetch(`/.netlify/functions/obtener-invitado-nombre?displayname=${encodeURIComponent(nombre)}`)

    .then(r => r.json())

    .then(r => {

        if(!r.ok || r.invitados.length === 0){

            alert("No encontrado");
            return;

        }

        if(r.invitados.length === 1){

            seleccionar(r.invitados[0]);
            return;

        }

        mostrar("resultados");

        const cont =
            document.getElementById("listaResultados");

        cont.innerHTML = "";

        r.invitados.forEach(i => {

            cont.innerHTML += `
                <div class="result-item"
                    onclick='seleccionar(${JSON.stringify(i)})'>

                    <strong>${i.dipleyname}</strong>
                    <br>
                    Familia: ${i.familia}

                </div>
            `;

        });

    });

}

/* =========================
   BUSCAR POR FAMILIA QR
========================= */

function buscarPorFamilia(familia){

    fetch(`/.netlify/functions/obtener-invitado-qr?familia=${encodeURIComponent(familia)}`)

    .then(r => r.json())

    .then(r => {

        if(!r.ok || r.invitados.length === 0){

            alert("Familia no encontrada");
            return;

        }

        if(r.invitados.length === 1){

            seleccionar(r.invitados[0]);
            return;

        }

        mostrar("resultados");

        const cont =
            document.getElementById("listaResultados");

        cont.innerHTML = "";

        r.invitados.forEach(i => {

            cont.innerHTML += `
                <div class="result-item"
                    onclick='seleccionar(${JSON.stringify(i)})'>

                    <strong>${i.dipleyname}</strong>
                    <br>
                    Familia: ${i.familia}

                </div>
            `;

        });

    });

}

/* =========================
   SELECCIONAR
========================= */

function seleccionar(i){

    invitadoActual = i;

    mostrar("infoBox");

    const usados =
        i.pasesuti || 0;

    const disponibles =
        (i.pases || 0) - usados;

    document.getElementById("nombre").textContent =
        i.displayname;

    document.getElementById("pases").textContent =
        i.pases;

    document.getElementById("usados").textContent =
        usados;

    const disp =
        document.getElementById("disponibles");

    disp.textContent = disponibles;

    if(disponibles > 0){
        disp.className = "disponibles-ok";
    }else{
        disp.className = "disponibles-cero";
    }

    const btn =
        document.querySelector(".btn-primary");

    const estado =
        document.getElementById("estadoAcceso");

    if(i.rechazo === true){

        btn.disabled = true;
        btn.textContent = "Acceso Denegado";

        estado.textContent =
            "🔴 Invitación rechazada";

        estado.className =
            "estado-denegado";

    }
    else if(i.acepto !== true){

        btn.disabled = true;
        btn.textContent = "Pendiente";

        estado.textContent =
            "🟡 Invitación pendiente";

        estado.className =
            "estado-pendiente";

    }
    else if(disponibles <= 0){

        btn.disabled = true;
        btn.textContent =
            "Sin pases disponibles";

        estado.textContent =
            "🔴 Ya no tiene pases";

        estado.className =
            "estado-denegado";

    }
    else{

        btn.disabled = false;
        btn.textContent =
            "Registrar Entrada";

        estado.textContent =
            "🟢 Acceso permitido";

        estado.className =
            "estado-ok";

    }

    document
    .getElementById("mensaje")
    .style.display = "none";

}

/* =========================
   REGISTRAR ENTRADA
========================= */

function registrar(){

    if(!invitadoActual)
        return;

    const usados =
        invitadoActual.pasesuti || 0;

    const disponibles =
        (invitadoActual.pases || 0) - usados;

    const usar =
        parseInt(
            document.getElementById("pasesUsar").value
        );

    if(!usar || usar <= 0){

        alert("Cantidad inválida");
        return;

    }

    if(usar > disponibles){

        alert("Excede los disponibles");
        return;

    }

    fetch("/.netlify/functions/registrar-acceso", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            familia: invitadoActual.familia,
            pasesUsar: usar

        })

    })

    .then(r => r.json())

    .then(r => {

        if(r.ok){

            document
            .getElementById("mensaje")
            .style.display = "block";

            invitadoActual.pasesuti =
                usados + usar;

            seleccionar(invitadoActual);

        }else{

            alert(r.message || "Error");

        }

    });

}

/* =========================
   LISTA
========================= */

function cargarLista(){

    fetch("/.netlify/functions/listar-invitados")

    .then(r => r.json())

    .then(r => {

        if(!r.ok)
            return;

        invitados = r.invitados;

        renderTabla();

    });

}

document
.getElementById("busqueda")
.addEventListener("input", renderTabla);

document
.getElementById("filtroEstado")
.addEventListener("change", renderTabla);

function renderTabla(){

    const tabla =
        document.getElementById("tabla");

    tabla.innerHTML = "";

    const filtro =
        document.getElementById("filtroEstado").value;

    const busqueda =
        document.getElementById("busqueda")
        .value
        .toLowerCase();

    let aceptados = 0;
    let rechazados = 0;
    let pendientes = 0;
    let pasesConfirmados = 0;

    const filtrados = invitados.filter(i => {

        const texto =
            (i.dipleyname + " " + i.familia)
            .toLowerCase();

        if(!texto.includes(busqueda))
            return false;

        if(filtro === "aceptados" && !i.acepto)
            return false;

        if(filtro === "rechazados" && !i.rechazo)
            return false;

        if(
            filtro === "pendientes" &&
            (i.acepto || i.rechazo)
        )
            return false;

        return true;

    });

    filtrados.forEach(i => {

        const usados = i.pasesuti || 0;

        const disponibles =
            (i.pases || 0) - usados;

        let estado = "Pendiente";
        let clase = "pendiente";

        if(i.acepto){

            estado = "Aceptó";
            clase = "ok";

            aceptados++;

            pasesConfirmados += Number(i.pases || 0);

        }
        else if(i.rechazo){

            estado = "Rechazó";
            clase = "no";

            rechazados++;

        }
        else{

            pendientes++;

        }

        tabla.innerHTML += `
            <tr>
                <td>${i.familia}</td>
                <td>${i.dipleyname}</td>
                <td>${i.pases}</td>
                <td>${usados}</td>
                <td>${disponibles}</td>
                <td class="${clase}">
                    ${estado}
                </td>
            </tr>
        `;

    });

    document.getElementById("resumen").innerHTML = `
        Total: ${invitados.length}
        |
        🟢 ${aceptados}
        |
        🔴 ${rechazados}
        |
        🟡 ${pendientes}
        |
        🎟 ${pasesConfirmados}
    `;
}

mostrar("qr");

</script>

</body>
</html>
